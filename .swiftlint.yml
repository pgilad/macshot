# Run with `make lint`. CI runs it with --strict, so a warning fails the build.
# The rules come from maccy. Code that broke them when SwiftLint was added is excepted
# in two ways, and only new findings fail:
# - Files over a size limit (file, type or function length, complexity) disable those
#   rules in their first lines. A baseline cannot hold these findings: their message
#   holds the current size, so any edit would make them new. When a file gets under a
#   limit, superfluous_disable_command says so; remove the rule from its first lines.
# - .swiftlint-baseline.json lists the other old findings, mostly long lines. Change a
#   listed line and it must follow the rules. `make lint-baseline` records the current
#   findings; use it only to drop fixed ones.
included:
  - Package.swift
  - Sources
  - Tests
disabled_rules:
  - todo
  # Multi-line collection literals end with a comma, so a new element is a one-line diff.
  - trailing_comma
  # Persisted string enums keep explicit raw values, so renaming a case cannot change a
  # stored value.
  - redundant_string_enum_value
blanket_disable_command:
  # The size-limit exceptions in the first lines of old files cover the whole file.
  allowed_rules: [file_length, type_body_length, function_body_length, cyclomatic_complexity]
line_length:
  warning: 140
  ignores_comments: true
identifier_name:
  # Geometry code names points, sizes and offsets x, y, w, h, dx, dy, p0 and so on.
  min_length: 1
large_tuple:
  warning: 3
cyclomatic_complexity:
  warning: 15
function_body_length:
  warning: 100
file_length:
  warning: 1000
type_body_length:
  warning: 700
