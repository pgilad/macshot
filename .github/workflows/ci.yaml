name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # A fixed Xcode, so a runner image update cannot change the compiler.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The build has no compiler warnings. Keep it that way.
      SWIFT_FLAGS: -Xswiftc -warnings-as-errors
    steps:
      # Pinned to a commit, not a movable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      # A fixed SwiftLint release, checked against its published SHA-256.
      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - run: make lint
      - run: make test
      - run: make self-test
      - run: make dist
      # The app and the tests write errors to the unified log, not to the terminal.
      - name: Show the app log
        if: failure()
        run: /usr/bin/log show --last 15m --style compact --info --predicate 'subsystem == "com.pgilad.macshot"'

  # The same tests on macOS 27, built with the macOS 27 SDK. GitHub marks this image as a preview.
  macos-27:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SWIFT_FLAGS: -Xswiftc -warnings-as-errors
      # In this VM, Vision cannot compile its accurate text recognition model, so those
      # OCR tests fail. The macOS 26 job and a Mac run them.
      MACSHOT_SKIP_ACCURATE_OCR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sw_vers && swift --version
      - run: make test
      - run: make self-test
      - run: make dist
      # The app and the tests write errors to the unified log, not to the terminal.
      - name: Show the app log
        if: failure()
        run: /usr/bin/log show --last 15m --style compact --info --predicate 'subsystem == "com.pgilad.macshot"'
